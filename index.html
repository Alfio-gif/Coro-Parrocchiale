 else if(a=="svn"){if(SV&&SV.i<SV.L.length-1){SV.i++;svR()}}
 else if(a=="svp"){if(SV&&SV.i>0){SV.i--;svR()}}
 else if(a=="svx")$("sv").close()
 else if(a=="rd"){ls.set("coro.cr",D.comm.date||D.comm.text);render()}
 else if(a=="tip"){TS.push(tab);ls.set("coro.tip",JSON.stringify(TS));render()}
 else if(a=="nt"){const b=$("nt"+d.id);b.classList.toggle("hid");if(!b.classList.contains("hid"))b.querySelector("textarea").focus()}
 else if(a=="sync")load();
 else if(a=="login"){const p=$("pw").value;if(!cfg()){$("lm").textContent="⚠️ Sincronizzazione non configurata";return}
  $("lm").textContent="Verifica…";try{const r=await post({a:"get",pwd:p});if(r.ok){pwd=p;sessionStorage.setItem("p",p);adm=true;D=norm(r.data);cache();stat="✅ Accesso Admin";render()}else $("lm").textContent="❌ Password errata"}catch(e){$("lm").textContent="❌ Errore di rete"}}
 else if(a=="out"){pwd="";sessionStorage.removeItem("p");adm=false;load()}
 else if(a=="new")openForm(d.k);
 else if(a=="edit")openForm(d.k,d.id);
 else if(a=="del"){if(confirm("Eliminare definitivamente questo elemento?"))mutate(()=>D[d.k]=D[d.k].filter(x=>x.id!=d.id))}
 else if(a=="ok")(ed.pr?okPres():ed.k?okForm():$("dg").close());
 else if(a=="cx")$("dg").close();
 else if(a=="push")push();
 else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));l.download="coro-backup-"+new Date().toISOString().slice(0,10)+".json";l.click()}
 else if(a=="savec"){const send=$("cw").checked;mutate(()=>D.comm={text:$("cm").value.trim(),date:new Date().toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"})});if(send&&D.comm.text)window.open("https://wa.me/?text="+encodeURIComponent("*Coro San Michele*\n"+D.comm.text),"_blank")}
 else if(a=="savel")mutate(()=>D.logo=$("lu").value.trim());
 else if(a=="chp"){const n=prompt("Nuova password (almeno 6 caratteri):");if(n&&n.length>=6){try{const r=await post({a:"chpwd",pwd,np:n});if(r.ok){pwd=n;sessionStorage.setItem("p",n);alert("Password cambiata")}else alert("Operazione rifiutata")}catch(e){alert("Errore di rete")}}else if(n)alert("Password troppo corta")}
 else if(a=="sec")$("s"+d.id).classList.toggle("hid")
 else if(a=="snot"){const t=$("pt").value.trim();if(!t){$("pt").focus();return}if(confirm("Inviare questa notifica a tutti i coristi?\n\n"+t)&&await sendPush(t))$("pt").value=""}
 else if(a=="ptest")await sendPush("Notifica di prova");
 else if(a=="fav"){fav=fav.includes(d.id)?fav.filter(x=>x!=d.id):[...fav,d.id];ls.set("coro.fav",JSON.stringify(fav));$("lst").innerHTML=tab=="sal"?listSal():listRep()}
 else if(a=="pres")presForm(d.id)
 else if(a=="shs"){const x=D.scalette.find(y=>y.id==d.id);if(x)window.open("https://wa.me/?text="+encodeURIComponent("*"+x.t+"*\nData: "+dd(x.data)+" · "+x.tipo+" · "+x.tempo+"\n\n"+(x.canti||[]).map(i=>D.canti.find(y=>y.id==i)).filter(Boolean).sort((p,q)=>MOM.indexOf(p.mom)-MOM.indexOf(q.mom)).map(c=>"- "+c.mom+": "+c.t).join("\n")+(x.spartito?"\n\nSpartito: "+x.spartito:"")),"_blank")}
 else if(a=="unl"){const m=$("pm"+d.id);m.textContent="Verifica…";try{const r=await post({a:"sec",id:d.id,pin:$("pn"+d.id).value});if(r.ok){unl[d.id]=r.s;$("s"+d.id).innerHTML=secHtml(D.coristi.find(x=>x.id==d.id))}else m.textContent="❌ PIN errato"}catch(e){m.textContent="❌ Errore di rete"}}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset)});
document.addEventListener("input",e=>{const i=e.target.dataset&&e.target.dataset.n;if(!i)return;const v=e.target.value.trim();if(v)NT[i]=v;else delete NT[i];ls.set("coro.n",JSON.stringify(NT))});
$("sv").addEventListener("close",()=>{clearInterval(svT);SV=null;try{wl&&wl.release()}catch(e){}wl=null});
document.addEventListener("input",e=>{const i=e.target.id,m={q:"q",ft:"t",fm:"m",fo:"o",sq:"sq",fs:"st",yq:"yq",yt:"yt"},was=filtOn();
 if(i=="ff")F.f=e.target.checked;else if(i=="yf")F.yf=e.target.checked;else if(m[i])F[m[i]]=e.target.value;else return;
 if(was&&!filtOn())resetOpen();
 $("lst").innerHTML=tab=="rep"?listRep():tab=="sal"?listSal():listSc()});
document.addEventListener("toggle",e=>{const t=e.target;fitGroups();if(t.dataset&&t.dataset.sc&&!(filtOn()&&/^(t-|y-|past$)/.test(t.dataset.sc)))(t.open?openSc.add(t.dataset.sc):openSc.delete(t.dataset.sc));if(t.hasAttribute&&t.hasAttribute("data-v")&&t.open)document.querySelectorAll("details[data-v]").forEach(x=>{if(x!=t)x.open=false})},true);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"+(FB.apiKey?"?"+new URLSearchParams(FB):"")).catch(()=>{}));
document.addEventListener("change",e=>{if(e.target.id!="imp")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=norm(JSON.parse(r.result));if(!confirm("Sostituire TUTTI i dati attuali con quelli del backup?"))return;j.v=D.v;D=j;mutate(()=>{})}catch(x){alert("File non valido")}};r.readAsText(f);e.target.value=""});
function theme(t){document.documentElement.dataset.theme=t;$("th").textContent=t=="dark"?"☀️":"🌙";ls.set("coro.th",t);document.querySelector('meta[name=theme-color]').content=t=="dark"?"#071a26":"#0ea5e9"}
$("th").onclick=()=>theme(document.documentElement.dataset.theme=="dark"?"light":"dark");theme(ls.get("coro.th")||"light");
async function sendPush(body){try{const r=await post({a:"push",pwd,title:"Coro San Michele",body});alert(r.ok?"Notifica inviata a "+r.sent+" dispositivi"+(r.failed?" ("+r.failed+" non raggiunti)":""):"Notifica non inviata: "+(r.err||"errore"));return !!r.ok}catch(e){alert("Errore di rete: notifica non inviata");return false}}
const pushOK=()=>!!(FB.apiKey&&VAPID&&cfg()&&"serviceWorker"in navigator&&"PushManager"in window&&"Notification"in window);
let fbm=null;
function loadFB(){return new Promise((ok,ko)=>{if(window.firebase&&firebase.messaging)return ok();const u=["app","messaging"].map(n=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${n}-compat.js`);let i=0;
 const nx=()=>{if(i>=u.length)return ok();const e=document.createElement("script");e.src=u[i++];e.onload=nx;e.onerror=()=>ko(new Error("Servizio notifiche non raggiungibile"));document.head.appendChild(e)};nx()})}
async function fbInit(){await loadFB();if(!fbm){if(!firebase.apps.length)firebase.initializeApp(FB);fbm=firebase.messaging();const reg=await navigator.serviceWorker.ready;
 fbm.onMessage(p=>{const d=p.data||{};reg.showNotification(d.title||"Coro San Michele",{body:d.body||"",icon:"icon-192.png",data:{url:d.url||"./"}})})}return fbm}
const bell=()=>{const t=ls.get("coro.tok");$("bn").textContent=t&&Notification.permission=="granted"?"🔔":"🔕";$("bn").title=t?"Notifiche attive (tocca per disattivarle)":"Attiva le notifiche"};
async function togglePush(){try{const m=await fbInit(),reg=await navigator.serviceWorker.ready,old=ls.get("coro.tok");
  if(old){if(!confirm("Disattivare le notifiche su questo dispositivo?"))return;try{await m.deleteToken()}catch(e){}post({a:"unreg",token:old}).catch(()=>{});try{localStorage.removeItem("coro.tok")}catch(e){}bell();return}
  if(await Notification.requestPermission()!="granted"){alert("Notifiche non autorizzate. Puoi abilitarle dalle impostazioni del telefono o del browser.");return}
  const tok=await m.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});if(!tok)throw new Error("token non ottenuto");
  const r=await post({a:"reg",token:tok});if(!r.ok)throw new Error("registrazione non riuscita");ls.set("coro.tok",tok);bell();alert("Notifiche attivate")}
 catch(e){alert("Impossibile attivare le notifiche: "+(e.message||e))}}
async function initPush(){if(!pushOK())return;$("bn").classList.remove("hid");bell();
 if(ls.get("coro.tok")&&Notification.permission=="granted"){try{const m=await fbInit(),reg=await navigator.serviceWorker.ready,t=await m.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg}),o=ls.get("coro.tok");
  if(t&&t!=o){await post({a:"reg",token:t});post({a:"unreg",token:o}).catch(()=>{});ls.set("coro.tok",t)}}catch(e){}}}
$("bn").onclick=togglePush;
function fitGroups(){document.querySelectorAll("details[open] > .sg").forEach(el=>{el.style.maxHeight="";const k=el.children;if(k.length>4){const a=k[0].getBoundingClientRect().top,b=k[3].getBoundingClientRect().bottom;el.style.maxHeight=Math.round(b-a+22)+"px"}})}
new MutationObserver(()=>requestAnimationFrame(fitGroups)).observe($("app"),{childList:true,subtree:true});
addEventListener("resize",fitGroups);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitGroups);
render();load();initPush();
</script></body></html>
