<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Coro San Michele</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coro San Michele">
<link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef8fd;--cd:#fff;--tx:#0c2a3d;--mu:#5b7a8c;--bd:#cfe7f4;--pr:#0ea5e9;--pd:#0369a1;--lt:#e0f2fe}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif}
.w{max-width:760px;margin:0 auto;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.br{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
#lg{display:block;width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 8px;background:#fff;border:3px solid #fff8}
.tt{text-align:left}.tt h1{margin:0;font-size:19px}.tt div{font-size:12.5px;opacity:.92}
.comm{background:#fff7d6;border:1px solid #f1d46a;border-radius:12px;padding:9px 11px;margin-bottom:10px}
.comm p{margin:3px 0;white-space:pre-wrap}.comm small{color:#7a6a1c}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.c h3{margin:0 0 6px;font-size:14px;color:var(--pd)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#f7fcff;font:inherit;color:var(--tx)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.g .f{grid-column:1/-1}
.bt,.b{display:inline-block;padding:7px 10px;border-radius:8px;border:1px solid var(--pr);background:var(--lt);color:var(--pd);font:600 12.5px Inter,sans-serif;text-decoration:none;cursor:pointer}
.b{background:var(--pr);color:#fff}.b.d{background:#dc2626;border-color:#dc2626}.b.s{background:var(--lt);color:var(--pd)}.bt.off{opacity:.4;pointer-events:none}
.rw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ch{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;color:#fff;margin-right:4px}
.mt{color:var(--mu);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--cd);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;padding:8px 2px;border:0;border-radius:10px;background:none;font:600 12px Inter,sans-serif;color:var(--mu);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
details{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px}
summary{padding:10px;cursor:pointer;font:700 14px Cinzel,serif;color:var(--pd);display:flex;justify-content:space-between}
.cr{padding:8px 10px;border-top:1px solid var(--bd)}
.sx{background:var(--lt);border-radius:8px;padding:8px;margin-top:6px}
.er{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--bd)}.er span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hid{display:none}
dialog{border:0;border-radius:14px;width:min(92vw,440px);max-height:88vh;padding:14px;color:var(--tx)}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px}
</style></head><body>
<div class="w">
<div class="br"><img id="lg" alt="Logo" class="hid"><div class="tt"><h1>Coro San Michele</h1><div>Parrocchia San Michele Arcangelo</div><div>Villasmundo</div></div></div>
<div id="app"></div>
</div>
<nav id="nv"></nav>
<dialog id="dg"><h3 id="dgt" class="cz" style="margin-top:0"></h3><form id="dgf" onsubmit="return false"></form><div class="rw"><button class="b" data-a="ok">Salva</button><button class="b s" data-a="cx">Annulla</button></div></dialog>
<script>
// ====== CONFIGURAZIONE: incolla qui il link dell'app web di Google Apps Script ======
const API="https://script.google.com/macros/s/AKfycbyXumgPccfotkCEKkub0xGztOCuXEB2flcJ8phCiCZN67KlJDOgH3d7lluEU1qiVHqi/exec
";
// ====================================================================================
const TEMPI={"Avvento":"#6d3fa8","Natale":"#d4a72c","Quaresima":"#4a1d5c","Pasqua":"#c9b36a","Tempo Ordinario":"#2e8b57","Generico":"#7b8794","Mariano":"#3b82f6"};
const MOM=["Ingresso","Kyrie","Gloria","Salmo","Alleluia","Lavanda dei piedi","Offertorio","Santo","Agnello di Dio","Comunione","Adorazione","Finale"];
const VOCI=["Soprani","Contralti","Tenori","Bassi"],TIPI=["Messa domenicale","Messa festiva","Matrimonio","Funerale","Adorazione","Altro"],TK=Object.keys(TEMPI);
const TT={canti:"Canto",scalette:"Scaletta",coristi:"Corista"};
const FD={canti:[["t","Titolo"],["tempo","Tempo liturgico","s",TK],["mom","Momento","s",MOM],["audio","Link audio (Drive)"],["spartito","Link spartito (Drive)"],["testo","Link testo (Drive)"]],
scalette:[["t","Titolo"],["data","Data","date"],["tempo","Tempo","s",TK],["tipo","Tipo","s",TIPI],["spartito","Link spartito (Drive)"],["testo","Link testo (Drive)"],["canti","Canti (selezione multipla)","m"]],
coristi:[["n","Nome e cognome"],["voce","Voce","s",VOCI],["tel","Telefono / WhatsApp","tel"],["audio","Link canto (Drive)"],["spartito","Link spartito (Drive)"],["testo","Link testo (Drive)"],["nota","Indicazioni per la propria parte","ta"]]};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D=norm(JSON.parse(ls.get("coro.d")||"{}")),tab="rep",pwd=sessionStorage.getItem("p")||"",adm=false,F={q:"",t:"",m:"",sq:"",st:""},stat="",ed={};
function norm(d){return{comm:d.comm||{text:"",date:""},logo:d.logo||"",canti:d.canti||[],scalette:d.scalette||[],coristi:d.coristi||[]}}
const cfg=()=>!API.startsWith("INCOLLA");
const post=async b=>(await fetch(API,{method:"POST",body:JSON.stringify(b)})).json();
const cache=()=>ls.set("coro.d",JSON.stringify(D));
const tm=()=>new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
async function load(){
 if(!cfg()){stat="⚠️ Link di sincronizzazione non configurato: dati locali del dispositivo.";return render()}
 stat="⏳ Sincronizzazione in corso…";render();
 try{let r=null;
  if(pwd){r=await post({a:"get",pwd});if(!r.ok){pwd="";sessionStorage.removeItem("p");r=null}}
  if(!r)r=await(await fetch(API,{cache:"no-store"})).json();
  adm=!!r.admin;D=norm(r.data);cache();stat="✅ Sincronizzato alle "+tm()}
 catch(e){stat="📴 Offline: mostro gli ultimi dati salvati sul dispositivo"}
 render()}
async function push(){
 if(!adm||!cfg())return;stat="⏳ Salvataggio su Google Drive…";rs();
 try{const r=await post({a:"save",pwd,data:D});stat=r.ok?"✅ Salvato su Drive alle "+tm():"❌ Salvataggio rifiutato (password?)"}catch(e){stat="❌ Errore di rete: modifiche non salvate su Drive"}
 rs()}
const rs=()=>document.querySelectorAll(".stt").forEach(e=>e.textContent=stat);
function mutate(f){f();cache();push();render()}
const lk=(l,u)=>u?`<a class="bt" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:`<span class="bt off">${l}</span>`;
const chip=t=>`<span class="ch" style="background:${TEMPI[t]||"#7b8794"}">${esc(t)}</span>`;
const dd=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}):"";
const opt=(a,v,all)=>(all?`<option value="">${all}</option>`:"")+a.map(x=>`<option${x==v?" selected":""}>${x}</option>`).join("");
function logo(u){const m=u&&u.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w400`:u}
function wa(t){let n=String(t).replace(/\D/g,"");if(n.startsWith("00"))n=n.slice(2);else if(n.length==10&&n[0]=="3")n="39"+n;return n}
const comm=()=>`<div class="comm"><b class="cz">📢 Comunicazioni Importanti</b><p>${esc(D.comm.text)||"Nessuna comunicazione."}</p><small>${esc(D.comm.date)}</small></div>`;
const sync=()=>`<div class="c"><h3>🔄 Sincronizzazione con Google Drive</h3><p class="mt" style="margin:0 0 6px">I dati si aggiornano da soli all'apertura o al ricaricamento dell'app. Per forzare l'aggiornamento tocca il pulsante.</p><div class="mt stt" style="margin-bottom:6px">${esc(stat)}</div><button class="b" data-a="sync">🔄 Sincronizza ora</button></div>`;
const sel=(id,ph,list,v)=>`<select id="${id}">${opt(list,v,ph)}</select>`;
function listRep(){const q=F.q.toLowerCase(),L=D.canti.filter(c=>(!q||c.t.toLowerCase().includes(q))&&(!F.t||c.tempo==F.t)&&(!F.m||c.mom==F.m)).sort((a,b)=>a.t.localeCompare(b.t));
 return L.length?L.map(c=>`<div class="c"><b>${esc(c.t)}</b><div style="margin:3px 0">${chip(c.tempo)}<span class="mt">${esc(c.mom)}</span></div><div class="rw">${lk("🔊 Audio",c.audio)}${lk("🎼 Spartito",c.spartito)}${lk("📄 Testo",c.testo)}</div></div>`).join(""):'<div class="mt" style="text-align:center;padding:12px">Nessun canto trovato</div>'}
function listSc(){const q=F.sq.toLowerCase(),L=D.scalette.filter(s=>(!q||s.t.toLowerCase().includes(q))&&(!F.st||s.tempo==F.st)).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
 return L.length?L.map(s=>`<div class="c"><b>${esc(s.t)}</b><div style="margin:3px 0">${chip(s.tempo)}<span class="mt">${dd(s.data)} · ${esc(s.tipo)}</span></div>${(s.canti||[]).length?"<ol style='margin:4px 0;padding-left:20px'>"+s.canti.map(i=>{const c=D.canti.find(x=>x.id==i);return c?`<li>${esc(c.t)} <span class="mt">(${esc(c.mom)})</span></li>`:""}).join("")+"</ol>":""}<div class="rw">${lk("🎼 Spartito",s.spartito)}${lk("📄 Testo",s.testo)}</div></div>`).join(""):'<div class="mt" style="text-align:center;padding:12px">Nessuna scaletta trovata</div>'}
function tabRep(){return `<div class="c"><div class="g"><input id="q" class="f" type="search" placeholder="🔎 Cerca canto…" value="${esc(F.q)}">${sel("ft","Tutti i tempi",TK,F.t)}${sel("fm","Tutti i momenti",MOM,F.m)}</div></div><div id="lst">${listRep()}</div>${sync()}`}
function tabSc(){return `<div class="c"><div class="g"><input id="sq" type="search" placeholder="🔎 Cerca per titolo…" value="${esc(F.sq)}">${sel("fs","Tutti i tempi",TK,F.st)}</div></div><div id="lst">${listSc()}</div>`}
function tabCor(){return `<div class="c" style="text-align:center"><b class="cz">Coro Parrocchiale - Elementi attivi</b></div>`+VOCI.map(v=>{const L=D.coristi.filter(c=>c.voce==v).sort((a,b)=>a.n.localeCompare(b.n));
 return `<details data-v><summary><span>${v}</span><span>${L.length}</span></summary>${L.map(c=>`<div class="cr"><div class="er" style="border:0;padding:0"><span><b>${esc(c.n)}</b>${adm&&c.tel?` <small class="mt">📞 ${esc(c.tel)}</small>`:""}</span>${adm&&c.tel?`<a class="bt" target="_blank" rel="noopener" href="https://wa.me/${wa(c.tel)}">💬</a>`:""}<button class="b s" data-a="sec" data-id="${c.id}">📂 La mia sezione</button></div><div class="sx hid" id="s${c.id}"><div class="rw" style="margin:0 0 6px">${lk("🔊 Canto",c.audio)}${lk("🎼 Spartito",c.spartito)}${lk("📄 Testo",c.testo)}</div><div class="mt"><b>Indicazioni per la mia parte</b></div><div style="white-space:pre-wrap">${esc(c.nota)||"Nessuna indicazione."}</div></div></div>`).join("")||'<div class="cr mt">Nessun corista</div>'}</details>`}).join("")}
function tabAd(){
 if(!adm)return `<div class="c"><h3>🔒 Vista Admin</h3><p class="mt" style="margin:0 0 6px">Inserisci la password per accedere al pannello.</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="rw"><button class="b" data-a="login">Accedi</button></div><div class="mt" id="lm" style="margin-top:6px">${cfg()?"":"⚠️ Sincronizzazione non configurata"}</div></div>`;
 const gl=k=>`<div class="c"><h3>${{canti:"🎵 Canti",scalette:"📋 Scalette",coristi:"👥 Coristi"}[k]}</h3>${D[k].map(x=>`<div class="er"><span>${esc(x.t||x.n)}</span><button class="b s" data-a="edit" data-k="${k}" data-id="${x.id}">✏️</button><button class="b d" data-a="del" data-k="${k}" data-id="${x.id}">🗑️</button></div>`).join("")||'<div class="mt">Vuoto</div>'}</div>`;
 return `<div class="c" style="background:var(--pd);color:#fff"><h2 class="cz" style="margin:0;font-size:15px">PANNELLO DI CONTROLLO DIREZIONE</h2><div class="rw"><button class="b s" data-a="chp">🔑 Cambia password</button><button class="b s" data-a="out">Esci</button></div></div>
<div class="c"><div class="rw" style="margin:0"><button class="b" data-a="new" data-k="canti">➕ Aggiungi Canto al Repertorio</button><button class="b" data-a="new" data-k="scalette">➕ Crea Nuova Scaletta</button><button class="b" data-a="new" data-k="coristi">➕ Aggiungi/Modifica Corista</button></div></div>
<div class="c"><div class="rw" style="margin:0"><button class="b" data-a="push">☁️ Salva su Google Drive</button><button class="b s" data-a="exp">⬇️ Esporta Backup JSON</button></div><div class="mt stt" style="margin-top:6px">${esc(stat)}</div></div>
<div class="c"><h3>GESTIONE COMUNICAZIONI IMPORTANTI</h3><textarea id="cm" rows="4" placeholder="Scrivi la comunicazione…">${esc(D.comm.text)}</textarea><label style="margin:6px 0"><input type="checkbox" id="cw" style="width:auto"> Invia notifica via WhatsApp ai coristi</label><button class="b" data-a="savec">💾 Salva e invia · Aggiornamento/Comunicazioni</button></div>
<div class="c"><h3>🖼️ Logo del coro</h3><input id="lu" placeholder="Link del logo su Google Drive" value="${esc(D.logo)}"><div class="rw"><button class="b" data-a="savel">Salva link</button></div></div>
${gl("canti")}${gl("scalette")}${gl("coristi")}${sync()}`}
function render(){const L=logo(D.logo);$("lg").classList.toggle("hid",!L);if(L)$("lg").src=L;
 $("app").innerHTML=comm()+({rep:tabRep,sc:tabSc,cor:tabCor,ad:tabAd}[tab])();
 $("nv").innerHTML=[["rep","🎵 Repertorio"],["sc","📋 Scalette"],["cor","👥 Coristi"],["ad",adm?"🛠️ Admin":"🔒 Admin"]].map(([k,l])=>`<button data-a="tab" data-t="${k}" class="${tab==k?"on":""}">${l}</button>`).join("")}
function openForm(k,id){const it=id?D[k].find(x=>x.id==id):{};ed={k,id};
 $("dgt").textContent=(id?"Modifica ":k=="scalette"?"Crea ":"Aggiungi ")+TT[k];
 $("dgf").innerHTML=FD[k].map(([n,l,t,o])=>{const v=it[n]??"";let c;
  if(t=="s")c=`<select name="${n}">${opt(o,v)}</select>`;
  else if(t=="m")c=`<select name="${n}" multiple size="5">${D.canti.map(x=>`<option value="${x.id}"${(it[n]||[]).includes(x.id)?" selected":""}>${esc(x.t)}</option>`).join("")}</select>`;
  else if(t=="ta")c=`<textarea name="${n}" rows="3">${esc(v)}</textarea>`;
  else c=`<input name="${n}" type="${t||"text"}" value="${esc(v)}">`;
  return `<label>${l}${c}</label>`}).join("");$("dg").showModal()}
function okForm(){const o={},el=$("dgf").elements;
 FD[ed.k].forEach(([n,,t])=>{o[n]=t=="m"?[...el[n].selectedOptions].map(x=>x.value):el[n].value.trim()});
 if(!(o.t||o.n)){alert("Inserisci titolo o nome");return}
 mutate(()=>{if(ed.id)Object.assign(D[ed.k].find(x=>x.id==ed.id),o);else D[ed.k].push({id:Date.now().toString(36),...o})});$("dg").close()}
function waList(){const t="📢 Coro San Michele: "+D.comm.text,L=D.coristi.filter(c=>c.tel);
 $("dgt").textContent="Invia su WhatsApp";ed={};
 $("dgf").innerHTML=(L.length?'<p class="mt">Tocca il nome per aprire WhatsApp con il messaggio già pronto.</p>':'<p class="mt">Nessun corista con numero di telefono.</p>')+L.map(c=>`<div class="er"><span>${esc(c.n)}</span><a class="bt" target="_blank" rel="noopener" href="https://wa.me/${wa(c.tel)}?text=${encodeURIComponent(t)}">💬 Invia</a></div>`).join("");$("dg").showModal()}
async function act(a,d){
 if(a=="tab"){tab=d.t;render()}
 else if(a=="sync")load();
 else if(a=="login"){const p=$("pw").value;if(!cfg()){$("lm").textContent="⚠️ Sincronizzazione non configurata";return}
  $("lm").textContent="Verifica…";try{const r=await post({a:"get",pwd:p});if(r.ok){pwd=p;sessionStorage.setItem("p",p);adm=true;D=norm(r.data);cache();stat="✅ Accesso Admin";render()}else $("lm").textContent="❌ Password errata"}catch(e){$("lm").textContent="❌ Errore di rete"}}
 else if(a=="out"){pwd="";sessionStorage.removeItem("p");adm=false;load()}
 else if(a=="new")openForm(d.k);
 else if(a=="edit")openForm(d.k,d.id);
 else if(a=="del"){if(confirm("Eliminare definitivamente questo elemento?"))mutate(()=>D[d.k]=D[d.k].filter(x=>x.id!=d.id))}
 else if(a=="ok")(ed.k?okForm():$("dg").close());
 else if(a=="cx")$("dg").close();
 else if(a=="push")push();
 else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));l.download="coro-backup-"+new Date().toISOString().slice(0,10)+".json";l.click()}
 else if(a=="savec"){const send=$("cw").checked;mutate(()=>D.comm={text:$("cm").value.trim(),date:new Date().toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"})});if(send&&D.comm.text)waList()}
 else if(a=="savel")mutate(()=>D.logo=$("lu").value.trim());
 else if(a=="chp"){const n=prompt("Nuova password (almeno 6 caratteri):");if(n&&n.length>=6){try{const r=await post({a:"chpwd",pwd,np:n});if(r.ok){pwd=n;sessionStorage.setItem("p",n);alert("Password cambiata")}else alert("Operazione rifiutata")}catch(e){alert("Errore di rete")}}else if(n)alert("Password troppo corta")}
 else if(a=="sec")$("s"+d.id).classList.toggle("hid")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset)});
document.addEventListener("input",e=>{const i=e.target.id,m={q:"q",ft:"t",fm:"m",sq:"sq",fs:"st"};if(m[i]){F[m[i]]=e.target.value;$("lst").innerHTML=tab=="rep"?listRep():listSc()}});
document.addEventListener("toggle",e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute("data-v")&&t.open)document.querySelectorAll("details[data-v]").forEach(x=>{if(x!=t)x.open=false})},true);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();load();
</script></body></html>
