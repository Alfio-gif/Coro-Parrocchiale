<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Coro San Michele</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coro San Michele">
<link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef8fd;--cd:#fff;--tx:#0c2a3d;--mu:#5b7a8c;--bd:#cfe7f4;--pr:#0ea5e9;--pd:#0369a1;--lt:#e0f2fe;--in:#f7fcff;--cb:#fff7d6;--cbd:#f1d46a;--cbt:#7a6a1c}
:root[data-theme="dark"]{--bg:#071a26;--cd:#0e2a3b;--tx:#e6f4fb;--mu:#8fb3c6;--bd:#1c4560;--pr:#38bdf8;--pd:#7dd3fc;--lt:#12384f;--in:#0a2231;--cb:#3a3210;--cbd:#8a7a22;--cbt:#e9d98a}
[data-theme="dark"] .b{color:#04202e}[data-theme="dark"] .b.s{color:var(--pd)}[data-theme="dark"] .b.d{color:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif}
.w{max-width:760px;margin:0 auto;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.br{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
#lg{display:block;width:56px;height:56px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff8}#top .br{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin-bottom:6px;padding:8px 10px}
.tt{text-align:left}.tt h1{margin:0;font-size:15px;line-height:1.2}.tt div{font-size:11px;line-height:1.25;opacity:.95}.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}#vb{font-size:10.5px;font-weight:600;background:#fff3;border-radius:99px;padding:2px 8px;white-space:nowrap}#th{border:0;background:#fff3;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px}
.comm{background:var(--cb);border:1px solid var(--cbd);border-radius:12px;padding:9px 11px;margin-bottom:10px}
.comm p{margin:3px 0;white-space:pre-wrap}.comm small{color:var(--cbt)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.c h3{margin:0 0 6px;font-size:14px;color:var(--pd)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--in);font:inherit;color:var(--tx)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.g .f{grid-column:1/-1}
.bt,.b{display:inline-block;padding:7px 10px;border-radius:8px;border:1px solid var(--pr);background:var(--lt);color:var(--pd);font:600 12.5px Inter,sans-serif;text-decoration:none;cursor:pointer}
.b{background:var(--pr);color:#fff}.b.d{background:#dc2626;border-color:#dc2626}.b.s{background:var(--lt);color:var(--pd)}.bt.off{opacity:.4;pointer-events:none}
.rw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ch{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;color:#fff;margin-right:4px}
.mt{color:var(--mu);font-size:12px}.nx{border-left:4px solid var(--pr)}.st{background:none;border:0;font-size:19px;cursor:pointer;color:var(--pr)}
#top{position:sticky;top:0;z-index:20;background:var(--bg)}nav{display:flex;gap:4px;background:var(--cd);border-bottom:1px solid var(--bd);padding:6px 8px;max-width:760px;margin:0 auto}
nav button{flex:1;min-width:0;padding:8px 2px;border:0;border-radius:10px;background:none;font:600 12px Inter,sans-serif;color:var(--mu);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
details{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px}
summary{padding:10px;cursor:pointer;font:700 14px Cinzel,serif;color:var(--pd);display:flex;justify-content:space-between}
.cr{padding:8px 10px;border-top:1px solid var(--bd)}
.sx{background:var(--lt);border-radius:8px;padding:8px;margin-top:6px}
.er{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--bd)}.er span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hid{display:none}
dialog{border:0;background:var(--cd);border-radius:14px;width:min(92vw,440px);max-height:88vh;padding:14px;color:var(--tx)}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px}
</style></head><body>
<div id="top"><div class="w" style="padding-bottom:0"><div class="br"><div class="tt"><h1>Coro San Michele</h1><div>Parrocchia San Michele Arcangelo</div><div>Villasmundo</div></div><img id="lg" alt="Logo"><div class="rt"><span id="vb"></span><button id="th" title="Tema chiaro/scuro">🌙</button></div></div></div><nav id="nv"></nav></div>
<div class="w" style="padding-top:4px"><div id="app"></div></div>
<dialog id="dg"><h3 id="dgt" class="cz" style="margin-top:0"></h3><form id="dgf" onsubmit="return false"></form><div class="rw"><button class="b" data-a="ok">Salva</button><button class="b s" data-a="cx">Annulla</button></div></dialog>
<script>
// ====== CONFIGURAZIONE: incolla qui il link dell'app web di Google Apps Script ======
const API="https://script.google.com/macros/s/AKfycbydx_FcwjO1EGGVVwqmiHM45lsjbx59wS0lgVHKUiDEGBor8ukQYJFici63n7VTol5j/exec";
// ====================================================================================
const TEMPI={"Avvento":"#6d3fa8","Natale":"#d4a72c","Quaresima":"#4a1d5c","Pasqua":"#c9b36a","Tempo Ordinario":"#2e8b57","Generico":"#7b8794","Mariano":"#3b82f6"};
const MOM=["Ingresso","Kyrie","Gloria","Salmo","Alleluia","Lavanda dei piedi","Offertorio","Santo","Agnello di Dio","Comunione","Adorazione","Finale"];
const VOCI=["Soprani","Contralti","Tenori","Bassi"],TIPI=["Messa domenicale","Messa festiva","Matrimonio","Funerale","Adorazione","Altro"],TK=Object.keys(TEMPI);
const TT={canti:"Canto",scalette:"Scaletta",coristi:"Corista",prove:"Prova"};
const FD={prove:[["t","Titolo / note della prova"],["data","Data","date"],["ora","Ora","time"]],canti:[["t","Titolo"],["tempo","Tempo liturgico","s",TK],["mom","Momento","s",MOM],["audio","Link audio (Drive)"],["spartito","Link spartito (Drive)"],["testo","Link testo (Drive)"]],
scalette:[["t","Titolo"],["data","Data","date"],["tempo","Tempo","s",TK],["tipo","Tipo","s",TIPI],["spartito","Link spartito (Drive)"],["testo","Link testo (Drive)"],["canti","Canti (selezione multipla)","m"]],
coristi:[["n","Nome e cognome"],["voce","Voce","s",VOCI],["tel","Telefono / WhatsApp","tel"],["audio","Link canto (Drive)"],["spartito","Link spartito (Drive)"],["testo","Link testo (Drive)"],["pin","PIN sezione personale (facoltativo)"],["nota","Indicazioni per la propria parte","ta"]]};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D=norm(JSON.parse(ls.get("coro.d")||"{}")),tab="rep",pwd=sessionStorage.getItem("p")||"",adm=false,F={q:"",t:"",m:"",sq:"",st:""},stat="",ed={};
function norm(d){return{v:d.v||0,prove:d.prove||[],comm:d.comm||{text:"",date:""},logo:d.logo||"",canti:d.canti||[],scalette:d.scalette||[],coristi:d.coristi||[]}}
const cfg=()=>!API.startsWith("INCOLLA");
const post=async b=>(await fetch(API,{method:"POST",body:JSON.stringify(b)})).json();
const cache=()=>ls.set("coro.d",JSON.stringify(D));
const tm=()=>new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
async function load(){
 if(!cfg()){stat="⚠️ Link di sincronizzazione non configurato: dati locali del dispositivo.";return render()}
 stat="⏳ Sincronizzazione in corso…";render();
 try{let r=null;
  if(pwd){r=await post({a:"get",pwd});if(!r.ok){pwd="";sessionStorage.removeItem("p");r=null}}
  if(!r)r=await(await fetch(API,{cache:"no-store"})).json();
  adm=!!r.admin;D=norm(r.data);cache();stat="✅ Sincronizzato alle "+tm()}
 catch(e){stat="📴 Offline: mostro gli ultimi dati salvati sul dispositivo"}
 render()}
async function push(force){
 if(!adm||!cfg())return;stat="⏳ Salvataggio su Google Drive…";rs();
 try{const r=await post({a:"save",pwd,data:D,base:D.v||0,force:!!force});
  if(r.ok){D.v=r.v;cache();stat="✅ Salvato su Drive alle "+tm()}
  else if(r.err=="conflict"){stat="⚠️ Dati modificati da un altro dispositivo";if(confirm("Un altro dispositivo ha modificato i dati su Drive.\nOK = sovrascrivi con le tue modifiche\nAnnulla = ricarica i dati di Drive (perdi le tue ultime modifiche)"))return push(true);return load()}
  else stat="❌ Salvataggio rifiutato (password?)"}catch(e){stat="❌ Errore di rete: modifiche non salvate su Drive"}
 rs()}
const rs=()=>document.querySelectorAll(".stt").forEach(e=>e.textContent=stat);
function mutate(f){f();cache();push();render()}
const lk=(l,u)=>u?`<a class="bt" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:`<span class="bt off">${l}</span>`;
const chip=t=>`<span class="ch" style="background:${TEMPI[t]||"#7b8794"}">${esc(t)}</span>`;
const dd=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}):"";
const opt=(a,v,all)=>(all?`<option value="">${all}</option>`:"")+a.map(x=>`<option${x==v?" selected":""}>${x}</option>`).join("");
function logo(u){const m=u&&u.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w400`:u}
function wa(t){let n=String(t).replace(/\D/g,"");if(n.startsWith("00"))n=n.slice(2);else if(n.length==10&&n[0]=="3")n="39"+n;return n}
const comm=()=>`<div class="comm"><b class="cz">📢 Comunicazioni Importanti</b><p>${esc(D.comm.text)||"Nessuna comunicazione."}</p><small>${esc(D.comm.date)}</small></div>`;
const sync=()=>`<div class="c"><h3>🔄 Sincronizzazione con Google Drive</h3><p class="mt" style="margin:0 0 6px">I dati si aggiornano da soli all'apertura o al ricaricamento dell'app. Per forzare l'aggiornamento tocca il pulsante.</p><div class="mt stt" style="margin-bottom:6px">${esc(stat)}</div><button class="b" data-a="sync">🔄 Sincronizza ora</button></div>`;
const sel=(id,ph,list,v)=>`<select id="${id}">${opt(list,v,ph)}</select>`;
function listRep(){const w=nz(F.q).split(/\s+/).filter(Boolean),L=D.canti.filter(c=>{const h=nz(c.t+" "+c.tempo+" "+c.mom);return w.every(x=>h.includes(x))&&(!F.t||c.tempo==F.t)&&(!F.m||c.mom==F.m)&&(!F.f||fav.includes(c.id))}).sort((a,b)=>F.o=="t"?TK.indexOf(a.tempo)-TK.indexOf(b.tempo)||a.t.localeCompare(b.t):a.t.localeCompare(b.t));
 return L.length?L.map(c=>`<div class="c"><div class="er" style="border:0;padding:0"><b class="cz" style="flex:1">${esc(c.t)}</b><button class="st" data-a="fav" data-id="${c.id}">${fav.includes(c.id)?"⭐":"☆"}</button></div><div style="margin:3px 0">${chip(c.tempo)}<span class="mt">${esc(c.mom)}</span></div><div class="rw">${lk("🔊 Audio",c.audio)}${lk("🎼 Spartito",c.spartito)}${lk("📄 Testo",c.testo)}</div></div>`).join(""):'<div class="mt" style="text-align:center;padding:12px">Nessun canto trovato</div>'}
function listSc(){const w=nz(F.sq).split(/\s+/).filter(Boolean),L=D.scalette.filter(s=>{const h=nz(s.t+" "+s.tempo+" "+s.tipo);return w.every(x=>h.includes(x))&&(!F.st||s.tempo==F.st)}).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
 return L.length?L.map(s=>`<div class="c"><b class="cz">${esc(s.t)}</b><div style="margin:3px 0">${chip(s.tempo)}<span class="mt">${dd(s.data)} · ${esc(s.tipo)}</span></div>${songs(s)}<div class="rw">${lk("🎼 Spartito",s.spartito)}${lk("📄 Testo",s.testo)}<button class="bt" data-a="shs" data-id="${s.id}">💬 Condividi</button></div></div>`).join(""):'<div class="mt" style="text-align:center;padding:12px">Nessuna scaletta trovata</div>'}
const nz=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let fav=[];try{fav=JSON.parse(ls.get("coro.fav")||"[]")}catch(e){}
let unl={};
function secHtml(c){const x=unl[c.id]?Object.assign({},c,unl[c.id]):c;
 if(c.prot&&!adm&&!unl[c.id])return `<div class="mt" style="margin-bottom:6px">🔒 Sezione protetta da PIN</div><div class="rw" style="margin:0"><input type="password" inputmode="numeric" id="pn${c.id}" placeholder="PIN" style="flex:1"><button class="b" data-a="unl" data-id="${c.id}">🔓 Sblocca</button></div><div class="mt" id="pm${c.id}"></div>`;
 return `<div class="rw" style="margin:0 0 6px">${lk("🔊 Canto",x.audio)}${lk("🎼 Spartito",x.spartito)}${lk("📄 Testo",x.testo)}</div><div class="mt"><b>Indicazioni per la mia parte</b></div><div style="white-space:pre-wrap">${esc(x.nota)||"Nessuna indicazione."}</div>`}
function prv(){return `<div class="c"><h3>🗓️ Prove e presenze</h3><button class="b" data-a="new" data-k="prove">➕ Nuova prova</button>${[...D.prove].sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(p=>`<div class="er"><span>${dd(p.data)} ${esc(p.ora)} · ${esc(p.t)}</span><span class="mt" style="flex:none">✅ ${(p.pres||[]).length}/${D.coristi.length}</span><button class="b s" data-a="pres" data-id="${p.id}">📋 Presenze</button></div>`).join("")}</div>`}
function presForm(id){const p=D.prove.find(x=>x.id==id);ed={pr:id};$("dgt").textContent="Presenze · "+p.t;
 $("dgf").innerHTML=VOCI.map(v=>{const L=D.coristi.filter(c=>c.voce==v);return L.length?`<div class="mt"><b>${v}</b></div>`+L.map(c=>`<label style="margin:2px 0;color:var(--tx)"><input type="checkbox" name="${c.id}" style="width:auto"${(p.pres||[]).includes(c.id)?" checked":""}> ${esc(c.n)}</label>`).join(""):""}).join("")||'<p class="mt">Nessun corista</p>';$("dg").showModal()}
function okPres(){const p=D.prove.find(x=>x.id==ed.pr);mutate(()=>p.pres=[...$("dgf").elements].filter(x=>x.type=="checkbox"&&x.checked).map(x=>x.name));$("dg").close()}
const td=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function songs(s){return(s.canti||[]).map(i=>D.canti.find(x=>x.id==i)).filter(Boolean).sort((a,b)=>MOM.indexOf(a.mom)-MOM.indexOf(b.mom)).map(c=>`<div class="er"><span><small class="mt">${esc(c.mom)}</small><br><b class="cz">${esc(c.t)}</b></span>${lk("🔊",c.audio)}${lk("🎼",c.spartito)}${lk("📄",c.testo)}</div>`).join("")}
function nextBox(){const t=td(),s=D.scalette.filter(x=>x.data>=t).sort((a,b)=>a.data.localeCompare(b.data))[0];
 return s?`<div class="c nx"><b class="cz">⭐ Prossima scaletta</b><div class="cz" style="margin-top:3px">${esc(s.t)}</div><div style="margin:3px 0">${chip(s.tempo)}<span class="mt">${dd(s.data)} · ${esc(s.tipo)}</span></div>${tab=="rep"?'<button class="b s" data-a="tab" data-t="sc">Vedi scaletta</button>':songs(s)+`<div class="rw"><button class="bt" data-a="shs" data-id="${s.id}">💬 Condividi</button></div>`}</div>`:""}
function tabRep(){return `<div class="c"><div class="g"><input id="q" class="f" type="search" placeholder="🔎 Cerca canto…" value="${esc(F.q)}">${sel("ft","Tutti i tempi",TK,F.t)}${sel("fm","Tutti i momenti",MOM,F.m)}<select id="fo"><option value="">Ordina per titolo</option><option value="t"${F.o=="t"?" selected":""}>Ordina per tempo liturgico</option></select><label class="mt" style="margin:0;align-self:center"><input type="checkbox" id="ff" style="width:auto"${F.f?" checked":""}> ⭐ Solo preferiti</label></div></div><div id="lst">${listRep()}</div>${sync()}`}
function tabSc(){return `<div class="c"><div class="g"><input id="sq" type="search" placeholder="🔎 Cerca per titolo…" value="${esc(F.sq)}">${sel("fs","Tutti i tempi",TK,F.st)}</div></div><div id="lst">${listSc()}</div>`}
function tabCor(){return `<div class="c" style="text-align:center"><b class="cz">Coro Parrocchiale - Elementi attivi</b></div>`+VOCI.map(v=>{const L=D.coristi.filter(c=>c.voce==v).sort((a,b)=>a.n.localeCompare(b.n));
 return `<details data-v><summary><span>${v}</span><span>${L.length}</span></summary>${L.map(c=>`<div class="cr"><div class="er" style="border:0;padding:0"><span><b>${esc(c.n)}</b>${adm&&c.tel?` <small class="mt">📞 ${esc(c.tel)}</small>`:""}</span>${adm&&c.tel?`<a class="bt" target="_blank" rel="noopener" href="https://wa.me/${wa(c.tel)}">💬</a>`:""}<button class="b s" data-a="sec" data-id="${c.id}">📂 La mia sezione</button></div><div class="sx hid" id="s${c.id}">${secHtml(c)}</div></div>`).join("")||'<div class="cr mt">Nessun corista</div>'}</details>`}).join("")}
function tabAd(){
 if(!adm)return `<div class="c"><h3>🔒 Vista Admin</h3><p class="mt" style="margin:0 0 6px">Inserisci la password per accedere al pannello.</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="rw"><button class="b" data-a="login">Accedi</button></div><div class="mt" id="lm" style="margin-top:6px">${cfg()?"":"⚠️ Sincronizzazione non configurata"}</div></div>`;
 const gl=k=>`<div class="c"><h3>${{canti:"🎵 Canti",scalette:"📋 Scalette",coristi:"👥 Coristi",prove:"🗓️ Elenco prove"}[k]}</h3>${D[k].map(x=>`<div class="er"><span>${esc(x.t||x.n)}</span><button class="b s" data-a="edit" data-k="${k}" data-id="${x.id}">✏️</button><button class="b d" data-a="del" data-k="${k}" data-id="${x.id}">🗑️</button></div>`).join("")||'<div class="mt">Vuoto</div>'}</div>`;
 return `<div class="c" style="background:var(--pd);color:#fff"><h2 class="cz" style="margin:0;font-size:15px">PANNELLO DI CONTROLLO DIREZIONE</h2><div class="rw"><button class="b s" data-a="chp">🔑 Cambia password</button><button class="b s" data-a="out">Esci</button></div></div>
<div class="c"><div class="rw" style="margin:0"><button class="b" data-a="new" data-k="canti">➕ Aggiungi Canto al Repertorio</button><button class="b" data-a="new" data-k="scalette">➕ Crea Nuova Scaletta</button><button class="b" data-a="new" data-k="coristi">➕ Aggiungi/Modifica Corista</button></div></div>
<div class="c"><div class="rw" style="margin:0"><button class="b" data-a="push">☁️ Salva su Google Drive</button><button class="b s" data-a="exp">⬇️ Esporta Backup JSON</button><label class="b s">⬆️ Importa Backup<input type="file" id="imp" accept=".json" class="hid"></label></div><div class="mt stt" style="margin-top:6px">${esc(stat)}</div></div>
<div class="c"><h3>GESTIONE COMUNICAZIONI IMPORTANTI</h3><textarea id="cm" rows="4" placeholder="Scrivi la comunicazione…">${esc(D.comm.text)}</textarea><label style="margin:6px 0"><input type="checkbox" id="cw" style="width:auto"> Invia notifica via WhatsApp ai coristi</label><button class="b" data-a="savec">💾 Salva e invia · Aggiornamento/Comunicazioni</button></div>
<div class="c"><h3>🖼️ Logo del coro</h3><input id="lu" placeholder="Link del logo su Google Drive" value="${esc(D.logo)}"><div class="rw"><button class="b" data-a="savel">Salva link</button></div></div>
${prv()}${gl("canti")}${gl("scalette")}${gl("coristi")}${gl("prove")}${sync()}`}
function render(){const L=logo(D.logo);$("lg").src=L||"icon-192.png";$("vb").textContent=adm?"🛠️ Admin":"👤 Vista Corista";
 $("app").innerHTML=comm()+(tab=="rep"||tab=="sc"?nextBox():"")+({rep:tabRep,sc:tabSc,cor:tabCor,ad:tabAd}[tab])();
 $("nv").innerHTML=[["rep","🎵 Repertorio"],["sc","📋 Scalette"],["cor","👥 Coristi"],["ad",adm?"🛠️ Admin":"🔒 Admin"]].map(([k,l])=>`<button data-a="tab" data-t="${k}" class="${tab==k?"on":""}">${l}</button>`).join("")}
function openForm(k,id){const it=id?D[k].find(x=>x.id==id):{};ed={k,id};
 $("dgt").textContent=(id?"Modifica ":k=="scalette"?"Crea ":"Aggiungi ")+TT[k];
 $("dgf").innerHTML=FD[k].map(([n,l,t,o])=>{const v=it[n]??"";let c;
  if(t=="s")c=`<select name="${n}">${opt(o,v)}</select>`;
  else if(t=="m")c=`<select name="${n}" multiple size="5">${D.canti.map(x=>`<option value="${x.id}"${(it[n]||[]).includes(x.id)?" selected":""}>${esc(x.t)}</option>`).join("")}</select>`;
  else if(t=="ta")c=`<textarea name="${n}" rows="3">${esc(v)}</textarea>`;
  else c=`<input name="${n}" type="${t||"text"}" value="${esc(v)}">`;
  return `<label>${l}${c}</label>`}).join("");$("dg").showModal()}
function okForm(){const o={},el=$("dgf").elements;
 FD[ed.k].forEach(([n,,t])=>{o[n]=t=="m"?[...el[n].selectedOptions].map(x=>x.value):el[n].value.trim()});
 if(!(o.t||o.n)){alert("Inserisci titolo o nome");return}
 mutate(()=>{if(ed.id)Object.assign(D[ed.k].find(x=>x.id==ed.id),o);else D[ed.k].push({id:Date.now().toString(36),...o})});$("dg").close()}
function waList(){const t="📢 Coro San Michele: "+D.comm.text,L=D.coristi.filter(c=>c.tel);
 $("dgt").textContent="Invia su WhatsApp";ed={};
 $("dgf").innerHTML=(L.length?'<p class="mt">Tocca il nome per aprire WhatsApp con il messaggio già pronto.</p>':'<p class="mt">Nessun corista con numero di telefono.</p>')+L.map(c=>`<div class="er"><span>${esc(c.n)}</span><a class="bt" target="_blank" rel="noopener" href="https://wa.me/${wa(c.tel)}?text=${encodeURIComponent(t)}">💬 Invia</a></div>`).join("");$("dg").showModal()}
async function act(a,d){
 if(a=="tab"){tab=d.t;render()}
 else if(a=="sync")load();
 else if(a=="login"){const p=$("pw").value;if(!cfg()){$("lm").textContent="⚠️ Sincronizzazione non configurata";return}
  $("lm").textContent="Verifica…";try{const r=await post({a:"get",pwd:p});if(r.ok){pwd=p;sessionStorage.setItem("p",p);adm=true;D=norm(r.data);cache();stat="✅ Accesso Admin";render()}else $("lm").textContent="❌ Password errata"}catch(e){$("lm").textContent="❌ Errore di rete"}}
 else if(a=="out"){pwd="";sessionStorage.removeItem("p");adm=false;load()}
 else if(a=="new")openForm(d.k);
 else if(a=="edit")openForm(d.k,d.id);
 else if(a=="del"){if(confirm("Eliminare definitivamente questo elemento?"))mutate(()=>D[d.k]=D[d.k].filter(x=>x.id!=d.id))}
 else if(a=="ok")(ed.pr?okPres():ed.k?okForm():$("dg").close());
 else if(a=="cx")$("dg").close();
 else if(a=="push")push();
 else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));l.download="coro-backup-"+new Date().toISOString().slice(0,10)+".json";l.click()}
 else if(a=="savec"){const send=$("cw").checked;mutate(()=>D.comm={text:$("cm").value.trim(),date:new Date().toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"})});if(send&&D.comm.text)waList()}
 else if(a=="savel")mutate(()=>D.logo=$("lu").value.trim());
 else if(a=="chp"){const n=prompt("Nuova password (almeno 6 caratteri):");if(n&&n.length>=6){try{const r=await post({a:"chpwd",pwd,np:n});if(r.ok){pwd=n;sessionStorage.setItem("p",n);alert("Password cambiata")}else alert("Operazione rifiutata")}catch(e){alert("Errore di rete")}}else if(n)alert("Password troppo corta")}
 else if(a=="sec")$("s"+d.id).classList.toggle("hid")
 else if(a=="fav"){fav=fav.includes(d.id)?fav.filter(x=>x!=d.id):[...fav,d.id];ls.set("coro.fav",JSON.stringify(fav));$("lst").innerHTML=listRep()}
 else if(a=="pres")presForm(d.id)
 else if(a=="shs"){const x=D.scalette.find(y=>y.id==d.id);if(x)window.open("https://wa.me/?text="+encodeURIComponent("🎶 *"+x.t+"*\n📅 "+dd(x.data)+" · "+x.tipo+" · "+x.tempo+"\n\n"+(x.canti||[]).map(i=>D.canti.find(y=>y.id==i)).filter(Boolean).sort((p,q)=>MOM.indexOf(p.mom)-MOM.indexOf(q.mom)).map(c=>"• "+c.mom+": "+c.t).join("\n")+(x.spartito?"\n\n🎼 "+x.spartito:"")),"_blank")}
 else if(a=="unl"){const m=$("pm"+d.id);m.textContent="Verifica…";try{const r=await post({a:"sec",id:d.id,pin:$("pn"+d.id).value});if(r.ok){unl[d.id]=r.s;$("s"+d.id).innerHTML=secHtml(D.coristi.find(x=>x.id==d.id))}else m.textContent="❌ PIN errato"}catch(e){m.textContent="❌ Errore di rete"}}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset)});
document.addEventListener("input",e=>{const i=e.target.id,m={q:"q",ft:"t",fm:"m",fo:"o",sq:"sq",fs:"st"};if(i=="ff"){F.f=e.target.checked;$("lst").innerHTML=listRep()}else if(m[i]){F[m[i]]=e.target.value;$("lst").innerHTML=tab=="rep"?listRep():listSc()}});
document.addEventListener("toggle",e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute("data-v")&&t.open)document.querySelectorAll("details[data-v]").forEach(x=>{if(x!=t)x.open=false})},true);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.addEventListener("change",e=>{if(e.target.id!="imp")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=norm(JSON.parse(r.result));if(!confirm("Sostituire TUTTI i dati attuali con quelli del backup?"))return;j.v=D.v;D=j;mutate(()=>{})}catch(x){alert("File non valido")}};r.readAsText(f);e.target.value=""});
function theme(t){document.documentElement.dataset.theme=t;$("th").textContent=t=="dark"?"☀️":"🌙";ls.set("coro.th",t);document.querySelector('meta[name=theme-color]').content=t=="dark"?"#071a26":"#0ea5e9"}
$("th").onclick=()=>theme(document.documentElement.dataset.theme=="dark"?"light":"dark");theme(ls.get("coro.th")||"light");
render();load();
</script></body></html>
